# Manual corrections to the automatic onset extraction (02_design.md 3.4)
# and, optionally, the automatic score extraction (3.6). Applied by
# tools/analyze_midi.py (onset) and tools/build_dataset.py (score).
#
# Each entry's `onset.midis` replaces the auto-detected onset group with a
# different set of MIDI note numbers, looked up from the same MIDI file
# (the actual note-on events found nearby in time -- never fabricated
# pitches). `onset.spread_sec` optionally widens the cluster-matching
# window past the default ONSET_WINDOW_SEC (50ms) for a chord that's
# genuinely rolled/arpeggiated across more than 50ms in this specific
# transcription. `reason` documents why, including source and confidence.
#
# An entry's `score` key, if present, wholesale-replaces the auto-extracted
# `score` object for that piece (3.6/3.8 schema) -- for cases where the
# piano-roll-to-notation heuristic in tools/score_extract.py gets the
# rhythm/grouping wrong (e.g. an arpeggiated opening chord breaks its
# tuplet-detection). Still built only from real MIDI note events for that
# piece, just re-grouped/re-quantized by hand.

- id: beethoven_waldstein_1
  onset:
    midis: [36, 43, 48, 52]
  reason: >
    Auto extraction (ONSET_WINDOW=50ms) caught only an isolated bass note
    (C2, MIDI 36) at t=0; the rest of the chord (G2/C3/E3) starts 187ms
    later in this specific transcription. Multiple sources describe the
    Waldstein's opening as "soft, rapidly repeating chords" (not an
    isolated bass note), so the full first chord is used as the quiz
    answer. Confidence: medium (based on secondary sources describing the
    passage as chordal; not verified against the printed score or by
    listening to this exact MIDI transcription).

