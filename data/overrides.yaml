    tuplet detection failed on the same rolled chord (irregular onset
    gaps), so score_extract.py fell back to raw duration quantization
    (mixed 32nd/16th/quarter tokens) instead of recognizing the full bar
    as two groups of quarter-note triplets in both hands; hand-corrected
    using the real note-on events at ticks 0/320/640/960/1280/1600 of
    measure 1 (960 ticks = 2 beats / 3 = 320 ticks per triplet note).
    Measure 2 is left as auto-extracted (not reported as wrong).
